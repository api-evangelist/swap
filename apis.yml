apis:
- name: Swap Agentic Storefront API
  description: >-
    Public Gateway API for the Agentic Storefront product: conversational
    discovery and chat, catalog/collection browsing, cart and checkout sessions,
    virtual try-on, orders and shipments, user profile and tracking consent, and
    a realtime assistant session (Wire Worker over WebSocket).
  humanURL: https://docs.api-swap-os.com/products/agentic-storefront/
  baseURL: https://prod-ws-gateway.api-swap-os.com
  properties:
  - type: Documentation
    url: https://docs.api-swap-os.com/products/agentic-storefront/
  - type: APIReference
    url: https://docs.api-swap-os.com/products/agentic-storefront/agentic-storefront-reference/
- name: Swap Global API
  description: >-
    Public API for Swap Global: the cross-border checkout flow of classify (HS
    codes) then optional shipping rates, calculate (taxes and duties), and order
    completion reporting.
  humanURL: https://docs.api-swap-os.com/products/global/
  baseURL: https://prod-global-server.api-swap-os.com
  properties:
  - type: Documentation
    url: https://docs.api-swap-os.com/products/global/
  - type: APIReference
    url: https://docs.api-swap-os.com/products/global/global-reference/
- name: Swap Protect API
  description: >-
    Public API for the Swap Protect product: enroll protected orders and manage
    claim activity (create/update orders, retrieve claims, send claim messages,
    fetch delivery declarations).
  humanURL: https://docs.api-swap-os.com/products/protect/
  baseURL: https://prod-protect-integrations.api-swap-os.com/protect-integrations/api/v1
  properties:
  - type: Documentation
    url: https://docs.api-swap-os.com/products/protect/
  - type: APIReference
    url: https://docs.api-swap-os.com/products/protect/protect-reference/swap-protect-api/
- name: Swap Returns API
  description: >-
    Public API for Swap Returns reverse logistics: list external returns (V1 and
    V2) and update quality-control status, with per-store JWT-signed webhooks for
    return lifecycle events.
  humanURL: https://docs.api-swap-os.com/products/returns/
  baseURL: https://api-gateway.swap-os.com/returns-api
  properties:
  - type: Documentation
    url: https://docs.api-swap-os.com/products/returns/
  - type: APIReference
    url: https://docs.api-swap-os.com/products/returns/returns-reference/get-external-returns-v-2/
- name: Swap Shipping API
  description: >-
    Public Shipping / Swap Values API: enrich a Shipment Intent into a
    customs-correct Compliance Pack (declared values, HS codes, commercial-invoice
    fields), create and cancel carrier shipping labels, and retrieve invoices,
    with HMAC-signed orderCreated and labelUpdated webhooks.
  humanURL: https://docs.api-swap-os.com/products/shipping/
  baseURL: https://api-gateway.swap-os.com/shipping/v1/public
  properties:
  - type: Documentation
    url: https://docs.api-swap-os.com/products/shipping/
  - type: APIReference
    url: https://docs.api-swap-os.com/products/shipping/shipping-reference/
- name: Swap TLC API
  description: >-
    Public Total Landed Cost API: compute guaranteed landed cost (duties, taxes,
    import fees) for single or bulk cross-border shipments, request HS-code
    classification, and report shipped or voided transactions.
  humanURL: https://docs.api-swap-os.com/products/tlc/
  baseURL: https://prod-tlc.api-swap-os.com/tax-duty/v1
  properties:
  - type: Documentation
    url: https://docs.api-swap-os.com/products/tlc/
  - type: APIReference
    url: https://docs.api-swap-os.com/products/tlc/tlc-reference/
  - type: ChangeLog
    url: https://docs.api-swap-os.com/products/tlc/release-notes/
