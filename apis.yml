aid: swap
name: Swap
description: >-
  Swap (Swap Commerce, Inc.) is an agentic commerce platform that helps merchants
  sell, ship, and scale globally, powering 700+ brands across AI-led product
  discovery, cross-border checkout, fulfillment, and returns on a shared per-store
  data layer. Swap exposes six independent public API surfaces: the Agentic
  Storefront API (conversational discovery, chat, virtual try-on, and checkout),
  the Global API (cross-border classify, shipping rates, tax and duty calculation,
  and order reporting), the Protect API (package-protection order enrollment and
  claims), the Returns API (reverse logistics and quality control), the Shipping
  API / Swap Values API (customs-correct declared values and commercial-invoice
  enrichment for any carrier label stack), and the TLC API (guaranteed total
  landed cost and HS-code classification). Every surface authenticates with a
  per-API, per-environment API key plus a store identifier, and several ship
  JWT- or HMAC-signed webhooks.
